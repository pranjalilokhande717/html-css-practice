<!DOCTYPE html>
<html>
<head>
    <title>BookMyShow Navbar</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* FIRST NAVBAR */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #ffffff;
            padding: 12px 45px;
        }

        /* LOGO */
        .logo img {
            width: 140px;
            height: 45px;
            object-fit: contain;
            display: block;
        }

        /* SEARCH BAR */
        .search-box {
            display: flex;
            align-items: center;
            width: 500px;
            height: 38px;
            background-color: #f5f5f5;
            border-radius: 5px;
            padding: 0 15px;
        }

        .search-icon {
            font-size: 18px;
            color: #777;
            margin-right: 10px;
        }

        .search-box input {
            border: none;
            outline: none;
            background: transparent;
            width: 100%;
            font-size: 14px;
        }

        /* RIGHT SIDE */
        .top-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .location {
            font-size: 14px;
            color: #333;
        }

        .location span {
            margin-left: 5px;
            font-size: 11px;
        }

        .sign-in {
            background-color: #f84464;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 7px 18px;
            font-size: 12px;
        }

        .menu-icon {
            font-size: 22px;
            color: #333;
        }

        /* SECOND NAVBAR */
        .bottom-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #ffffff;
            padding: 10px 45px;
            border-top: 1px solid #eeeeee;
        }

        /* LEFT LINKS */
        .left-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .left-links a {
            text-decoration: none;
            color: #333;
            font-size: 14px;
        }

        /* RIGHT LINKS */
        .right-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .right-links a {
            text-decoration: none;
            color: #333;
            font-size: 12px;
        }

    </style>
</head>


<body>

    <!-- FIRST ROW -->

    <nav class="top-nav">

        <div class="logo">
            <img src="./bookmyshow.jpg.jpeg" alt="BookMyShow">
        </div>

        <div class="search-box">

            <div class="search-icon">
                🔍
            </div>

            <input type="text"
                   placeholder="Search for Movies, Events, Plays, Sports and Activities">

        </div>

        <div class="top-right">

            <div class="location">
                Pune <span>▼</span>
            </div>

            <button class="sign-in">
                Sign in
            </button>

            <div class="menu-icon">
                ☰
            </div>

        </div>

    </nav>


    <!-- SECOND ROW -->

    <nav class="bottom-nav">

        <div class="left-links">

            <a href="#">Movies</a>
            <a href="#">Stream</a>
            <a href="#">Events</a>
            <a href="#">Plays</a>
            <a href="#">Sports</a>
            <a href="#">Activities</a>

        </div>


        <div class="right-links">

            <a href="#">ListYourShow</a>
            <a href="#">Corporates</a>
            <a href="#">Offers</a>
            <a href="#">Gift Cards</a>

        </div>

    </nav>

</body>
</html>
