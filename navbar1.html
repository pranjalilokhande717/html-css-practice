<!DOCTYPE html>
<html>
<head>
    <title>Wisdom Sprouts Navbar</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 60px 8px 25px;
            background-color: #d8eeee;
        }

        .logo img {
            width: 145px;
            height: auto;
        }

        .menu {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .menu a {
            text-decoration: none;
            color: #17284b;
            font-size: 20px;
        }

        .menu a:first-child {
            color: #ff5b28;
        }

        .contact {
            background-color: #ff6428;
            color: white !important;
            padding: 14px 28px;
            border-radius: 30px;
        }
    </style>
</head>

<body>

    <nav>

        <div class="logo">
            <img src="./logo of wisdom sproutss.jpg.jpeg" alt="Wisdom Sprouts">
        </div>

        <div class="menu">
            <a href="#">Home</a>
            <a href="#">About Us</a>
            <a href="#">Courses</a>
            <a href="#">Blogs</a>
            <a href="#">Placements</a>
            <a href="#">Internship</a>
            <a href="#">Gallery</a>
            <a href="#">Hire From Us</a>
            <a href="#" class="contact">Contact Us</a>
        </div>

    </nav>

</body>
</html>
