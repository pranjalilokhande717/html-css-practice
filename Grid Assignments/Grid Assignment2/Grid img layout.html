<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Assignment 2 - Grid Image Layout with Text</title>

    <style>
        .container {
            display: grid;

            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 180px 180px 100px;

            gap: 15px;

            width: 95%;
            margin: 20px auto;
        }

        .box {
            position: relative;
            overflow: hidden;
        }

        .box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .box p {
            position: absolute;
            top: 10px;
            left: 20px;

            color: white;
            font-size: 20px;
            font-weight: bold;

            margin: 0;
        }

        /* First row */
        .box1 {
            grid-column: 1;
            grid-row: 1;
        }

        .box2 {
            grid-column: 2 / 4;
            grid-row: 1;
        }

        /* Second row */
        .box3 {
            grid-column: 1 / 3;
            grid-row: 2;
        }

        .box4 {
            grid-column: 3;
            grid-row: 2;
        }

        /* Third row */
        .box5 {
            grid-column: 1;
            grid-row: 3;
        }

        .box6 {
            grid-column: 2;
            grid-row: 3;
        }

        .box7 {
            grid-column: 3;
            grid-row: 3;
        }
    </style>
</head>

<body>

    <h1>Assignment 2 - Grid Image Layout with Text</h1>

    <div class="container">

        <div class="box box1">
            <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23" alt="Nature">
            <p>The winter of my discontent</p>
        </div>

        <div class="box box2">
            <img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df" alt="City">
            <p>Instagram is toxic but I keep posting</p>
        </div>

        <div class="box box3">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" alt="Ocean">
            <p>Throwing my phone into the ocean</p>
        </div>

        <div class="box box4">
            <img src="https://images.unsplash.com/photo-1497366811353-6870744d04b2" alt="Room">
            <p>I'm never leaving my room</p>
        </div>

        <div class="box box5">
            <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba" alt="Horizon">
            <p>Staring at the horizon thinking</p>
        </div>

        <div class="box box6">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" alt="Water">
            <p>This is water</p>
        </div>

        <div class="box box7">
            <img src="https://images.unsplash.com/photo-1513883049090-d0b7439799bf" alt="Table">
            <p>Table for one please</p>
        </div>

    </div>

</body>

</html>
