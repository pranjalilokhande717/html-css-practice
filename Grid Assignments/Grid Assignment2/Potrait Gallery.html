<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Assignment 2 - Portrait Gallery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: grid;
            place-items: center;

            padding: 24px;

            background: #fff;

            font-family: Arial, sans-serif;
        }

        .gallery {
            --gap: 16px;

            width: min(100%, 700px);
            aspect-ratio: 1;

            padding: 32px;

            background: #f1f1f1;
        }

        .grid {
            display: grid;

            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);

            gap: var(--gap);

            width: 100%;
            height: 100%;
        }

        .tile {
            min-width: 0;
            min-height: 0;

            padding: 6px;

            background: #fff;

            border: 1px solid #e5e5e5;

            box-shadow: 0 1px 5px rgb(0 0 0 / 12%);

            transition:
                transform 250ms ease,
                box-shadow 250ms ease;
        }

        .tile img {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .tile:hover {
            position: relative;

            z-index: 1;

            transform: scale(1.12);

            box-shadow: 0 8px 20px rgb(0 0 0 / 25%);
        }

        @media (max-width: 520px) {

            .gallery {
                --gap: 8px;
                padding: 16px;
            }

            .tile {
                padding: 4px;
            }

            .tile:hover {
                transform: scale(1.08);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .tile {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <h1>Assignment 2 - Portrait Gallery</h1>

    <main class="gallery" aria-label="Portrait image gallery">

        <div class="grid">

            <div class="tile">
                <img src="./instaicon.jpg" alt="Portrait 1">
            </div>

            <div class="tile">
                <img src="./pilot pen.jpg" alt="Portrait 2">
            </div>

            <div class="tile">
                <img src="./eagle.jpg" alt="Portrait 3">
            </div>

            <div class="tile">
                <img src="./mountain image.png" alt="Portrait 4">
            </div>

            <div class="tile">
                <img src="./parker.jpg" alt="Portrait 5">
            </div>

            </div>

            <div class="tile">
                <img src="./loin.jpg" alt="Portrait 7">

            </div>

        </div>

    </main>

</body>

</html>
