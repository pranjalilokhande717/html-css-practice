<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Assignment 2 - Responsive CSS Grid</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            display: grid;

            grid-template-columns: 120px 1fr;
            grid-template-rows: 50px 200px 100px 60px;

            grid-template-areas:
                "sidebar navbar"
                "sidebar main"
                "sidebar content"
                "sidebar footer";

            gap: 5px;

            width: 90%;
            margin: 20px auto;
        }

        .navbar {
            grid-area: navbar;
            background-color: lightcyan;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sidebar {
            grid-area: sidebar;
            background-color: cyan;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main {
            grid-area: main;
            background-color: #80eeee;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .content {
            grid-area: content;

            display: grid;
            grid-template-columns: 1fr 1fr 1fr;

            gap: 5px;
        }

        .content1,
        .content2,
        .content3 {
            background-color: aquamarine;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .footer {
            grid-area: footer;
            background-color: #20d9b5;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* Responsive layout for smaller screens */

        @media (max-width: 600px) {

            .container {
                grid-template-columns: 1fr;

                grid-template-rows:
                    40px
                    40px
                    180px
                    80px
                    80px
                    80px
                    50px;

                grid-template-areas:
                    "navbar"
                    "sidebar"
                    "main"
                    "content1"
                    "content2"
                    "content3"
                    "footer";
            }

            .content {
                display: contents;
            }

            .content1 {
                grid-area: content1;
            }

            .content2 {
                grid-area: content2;
            }

            .content3 {
                grid-area: content3;
            }
        }
    </style>
</head>

<body>

    <h1>Assignment 2 - Responsive CSS Grid</h1>

    <div class="container">

        <div class="navbar">
            NAVBAR
        </div>

        <div class="sidebar">
            SIDEBAR
        </div>

        <div class="main">
            MAIN
        </div>

        <div class="content">

            <div class="content1">
                CONTENT 1
            </div>

            <div class="content2">
                CONTENT 2
            </div>

            <div class="content3">
                CONTENT 3
            </div>

        </div>

        <div class="footer">
            FOOTER
        </div>

    </div>

</body>

</html>
