<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram Login</title>
  <link rel="stylesheet" href="insta login.css" />
</head>
<body>
  <main class="page">
    <section class="left">
      <div class="instagram-icon" aria-label="Instagram">
       <img class="instagram-icon" src="./instaicon.jpg" alt="Instagram" />
      </div>

      <h1>
        See everyday moments from<br />
        your <span class="gradient-text">close friends</span>.
      </h1>

      <div class="images">

        <img src="./instalogin.jpg" alt="A shared moment" />
        <img src="./instalogin2.jpg" alt="A moment with friends" />
        <img src="./instalogin3.jpg" alt="A day out" />
      </div>
    </section>

    <section class="right">
      <form class="login-form">
        <h2>Log into Instagram</h2>

        <input
          type="text"
          placeholder="Mobile number, username or email"
          aria-label="Mobile number, username or email"
        />

        <input
          type="password"
          placeholder="Password"
          aria-label="Password"
        />

        <button class="login-button" type="button">Log in</button>

        <a class="forgot-link" href="#">Forgot password?</a>

        <button class="facebook-button" type="button">
          <span class="facebook-icon">f</span>
          Log in with Facebook
        </button>

        <button class="create-button" type="button">
          Create new account
        </button>
      </form>
    </section>
  </main>
</body>
</html>
