<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Navbar</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #ffffff;
    }

    .navbar-box {
      max-width: 470px;
      margin: auto;
      padding: 10px;
      background: white;
      box-shadow: 8px 8px 8px rgba(0, 0, 0, 0.35);
    }

    .navbar {
      background: orangered;
      min-height: 34px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 12px;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      font-size: 11px;
      font-weight: bold;
    }

    .navbar a:hover {
      text-decoration: underline;
    }

    .search-area {
      margin-left: auto;
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .search-area input {
      width: 115px;
      height: 14px;
      border: none;
      border-radius: 3px;
      padding: 2px 5px;
      font-size: 9px;
    }

    .search-area button {
      height: 16px;
      padding: 0 8px;
      border: none;
      border-radius: 8px;
      background: white;
      color: orangered;
      font-size: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    .search-area button:hover {
      background: #f0f0f0;
    }

    h1 {
      text-align: center;
      margin-top: 65px;
      color: #667;
      font-size: 28px;
      font-style: italic;
      font-weight: normal;
    }

    /* Mobile screen layout */
    @media (max-width: 500px) {
      .navbar {
        flex-wrap: wrap;
        padding: 10px;
      }

      .search-area {
        width: 100%;
        margin-left: 0;
      }

      .search-area input {
        flex: 1;
      }
    }
  </style>
</head>

<body>
  <div class="navbar-box">
    <nav class="navbar">
      <a href="#">Logo</a>
      <a href="#">Home</a>
      <a href="#">Products</a>
      <a href="#">Services</a>

      <div class="search-area">
        <input type="search" placeholder="Search" />
        <button type="submit">Go</button>
      </div>
    </nav>
  </div>

  <h1>Navbar on wide screens</h1>
</body>
</html>
