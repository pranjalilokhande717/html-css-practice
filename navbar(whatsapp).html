<!DOCTYPE html>
<html>
<head>
    <title>WhatsApp Navbar</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #202c33;
            color: white;
            padding: 8px 18px;
        }

        /* LEFT SIDE */
        .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .group-icon {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff4f64;
            font-size: 18px;
        }

        .group-info {
            display: flex;
            flex-direction: column;
        }

        .group-name {
            font-size: 14px;
            color: white;
        }

        .members {
            font-size: 9px;
            color: #aebac1;
            margin-top: 3px;
            max-width: 600px;
            white-space: nowrap;
            overflow: hidden;
        }

        /* RIGHT SIDE */
        .right {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .right-item {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #d1d7db;
            font-size: 13px;
        }

        .icon {
            font-size: 19px;
        }

        .arrow {
            font-size: 10px;
            color: #aebac1;
        }
    </style>
</head>

<body>

    <nav>

        <!-- LEFT -->
        <div class="left">

            <div class="group-icon">
                👥
            </div>

            <div class="group-info">

                <div class="group-name">
                    B101-WS-MERN-JFP
                </div>

                <div class="members">
                    B101, B101Komal, B87, Swapneel, WS, WS, +91 755 869 3115, +91 9798 78829, +91 84592 37342, +91 80559 10164, +91 93093 44891...
                </div>

            </div>

        </div>


        <!-- RIGHT -->
        <div class="right">

            <div class="right-item">
                <span class="icon">▣</span>
                <span>Add to list</span>
                <span class="arrow">▼</span>
            </div>

            <div class="right-item">
                <span class="icon">▢</span>
                <span class="arrow">▼</span>
            </div>

            <div class="right-item">
                <span class="icon">⌕</span>
            </div>

            <div class="right-item">
                <span class="icon">⋮</span>
            </div>

        </div>

    </nav>

</body>
</html>
