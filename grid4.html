<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Assignment 4 - Dashboard Layout</title>

    <style>
        .dashboard {
            display: grid;

            grid-template-columns: 200px 1fr 200px;
            grid-template-rows: 80px 400px 60px;

            grid-template-areas:
                "header header header"
                "nav main aside"
                "footer footer footer";

            gap: 10px;
        }

        .header {
            grid-area: header;
            background-color: lightblue;
            border: 1px solid black;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav {
            grid-area: nav;
            background-color: lightgreen;
            border: 1px solid black;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main {
            grid-area: main;
            background-color: lightyellow;
            border: 1px solid black;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .aside {
            grid-area: aside;
            background-color: lightpink;
            border: 1px solid black;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .footer {
            grid-area: footer;
            background-color: lightgray;
            border: 1px solid black;

            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <header class="header">
            Header
        </header>

        <nav class="nav">
            Navigation
        </nav>

        <main class="main">
            Main Content
        </main>

        <aside class="aside">
            Aside
        </aside>

        <footer class="footer">
            Footer
        </footer>

    </div>

</body>
</html>
