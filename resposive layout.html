<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Flexbox Layout</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #111;
    }

    .container {
      width: min(100%, 850px);
      padding: 10px;
      background: white;
      border-radius: 4px;
    }

    header,
    footer,
    aside,
    main {
      border-radius: 5px;
      padding: 18px;
      font-weight: bold;
      text-align: center;
    }

    header {
      background: tomato;
      height: 90px;
    }

    .content {
      display: flex;
      gap: 10px;
      margin: 10px 0;
      min-height: 210px;
    }

    aside {
      background: gold;
      flex: 1;
    }

    main {
      background: #09bceb;
      flex: 3;
      text-align: left;
      font-weight: normal;
    }

    .right-aside {
      background: #f65bb0;
    }

    footer {
      background: lightgreen;
      height: 55px;
    }

    /* TABLET: 481px to 768px */
    @media (max-width: 768px) {
      .content {
        flex-wrap: wrap;
      }

      main {
        order: -1;
        flex-basis: 100%;
        min-height: 130px;
      }

      aside {
        min-height: 60px;
      }
    }

    /* MOBILE: 480px and below */
    @media (max-width: 480px) {
      body {
        padding: 15px;
      }

      .content {
        flex-direction: column;
        min-height: auto;
      }

      main,
      aside {
        flex: auto;
        min-height: 100px;
      }

      main {
        order: 0;
      }

      header {
        height: 70px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <header>Header</header>

    <section class="content">
      <aside>Aside 1</aside>

      <main>
        Lorem ipsum dolor sit amet consectetur adipisicing elit.
        Ipsa expedita voluptas magnam doloribus error eius quisquam
        asperiores corrupti?
      </main>

      <aside class="right-aside">Aside 2</aside>
    </section>

    <footer>Footer</footer>
  </div>
</body>
</html>
