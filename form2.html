<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #fff;
      font-family: Arial, sans-serif;
      color: #777;
    }

    .registration-card {
      width: 312px;
      padding: 10px 28px 36px;
      background: #eee;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 1px 5px #bbb;
    }

    h1 {
      margin: 0;
      padding: 0 0 8px;
      border-bottom: 1px solid #ddd;
      text-align: center;
      font-size: 28px;
      font-weight: 300;
    }

    .options {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding: 18px 0;
      border-bottom: 1px solid #ddd;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .radio {
      width: 19px;
      height: 19px;
      display: inline-grid;
      place-items: center;
      border: 2px solid #4263b3;
      border-radius: 50%;
      background: #4263b3;
      color: white;
      font-size: 12px;
      font-weight: bold;
    }

    .radio.checked::after {
      content: "✓";
    }

    .fields {
      display: flex;
      flex-direction: column;
      gap: 13px;
      margin: 20px 10px;
    }

    .input-row {
      height: 35px;
      display: flex;
      box-shadow: 0 1px 4px #ccc;
    }

    .input-icon {
      width: 39px;
      display: grid;
      place-items: center;
      border-radius: 3px 0 0 3px;
      background: #4263b3;
      color: white;
      font-size: 16px;
    }

    input {
      width: 100%;
      min-width: 0;
      padding: 0 10px;
      border: 1px solid #ddd;
      border-radius: 0 3px 3px 0;
      outline: none;
      background: #fff;
      font-size: 14px;
    }

    .gender-options {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 22px 0 32px;
    }

    .bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .terms {
      margin: 0;
      font-size: 11px;
      line-height: 1.25;
    }

    .terms a {
      color: #4263b3;
    }

    button {
      padding: 9px 18px;
      border: 0;
      border-radius: 4px;
      background: #4263b3;
      color: white;
      font-size: 13px;
      cursor: pointer;
    }

    @media (max-width: 360px) {
      .registration-card {
        width: calc(100% - 24px);
        padding-right: 20px;
        padding-left: 20px;
      }
    }
  </style>
</head>
<body>
  <main class="registration-card">
    <h1>Registration</h1>

    <div class="options">
      <div class="option"><span class="radio checked"></span>Personal</div>
      <div class="option"><span class="radio"></span>Company</div>
    </div>

    <div class="fields">
      <div class="input-row">
        <span class="input-icon">✉</span>
        <input type="email" placeholder="Email" />
      </div>

      <div class="input-row">
        <span class="input-icon">♟</span>
        <input type="text" placeholder="Name" />
      </div>

      <div class="input-row">
        <span class="input-icon">⬟</span>
        <input type="password" placeholder="Password" />
      </div>
    </div>

    <div class="gender-options">
      <div class="option"><span class="radio checked"></span>Male</div>
      <div class="option"><span class="radio"></span>Female</div>
    </div>

    <div class="bottom-row">
      <p class="terms">
        By clicking Register, you<br />
        agree on our <a href="#">terms and<br />condition</a>.
      </p>
      <button type="button">Register</button>
    </div>
  </main>
</body>
</html>
