<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Assignment 5 - Card Layout</title>

    <style>
        .card-container {
            display: grid;

            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));

            gap: 20px;
            padding: 20px;
        }

        .card {
            border: 1px solid black;
            padding: 15px;
            text-align: center;
            background-color: lightgray;
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .card h2 {
            margin: 10px 0;
        }

        .card p {
            margin: 0;
        }
    </style>
</head>

<body>

    <h1>Assignment 5: Card Layout</h1>

    <div class="card-container">

        <div class="card">
            <img src="https://via.placeholder.com/300x150" alt="Image">
            <h2>Card 1</h2>
            <p>This is the description of card 1.</p>
