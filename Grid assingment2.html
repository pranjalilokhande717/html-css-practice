<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grid Image Layout</title>

    <style>
        .gallery {
            display: grid;

            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 150px 220px 190px;

            gap: 12px;

            width: 650px;
            margin: 30px auto;
        }

        .gallery img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image1 {
            grid-column: 1;
            grid-row: 1;
        }

        .image2 {
            grid-column: 2;
            grid-row: 1;
        }

        .image3 {
            grid-column: 3;
            grid-row: 1 / 3;
        }

        .image4 {
            grid-column: 1 / 3;
            grid-row: 2;
        }

        .image5 {
            grid-column: 1 / 3;
            grid-row: 3;
        }

        .image6 {
            grid-column: 3;
            grid-row: 3;
        }
    </style>
</head>

<body>

    <div class="gallery">

        <img class="image1"
             src="https://images.unsplash.com/photo-1498557850523-fd3d118b962e"
             alt="Blueberries">

        <img class="image2"
             src="https://images.unsplash.com/photo-1464965911861-746a04b4bca6"
             alt="Strawberries">

        <img class="image3"
             src="https://images.unsplash.com/photo-1587049352846-4a222e784d38"
             alt="Watermelon">

        <img class="image4"
             src="https://images.unsplash.com/photo-1547514701-42782101795e"
             alt="Orange">

        <img class="image5"
             src="https://images.unsplash.com/photo-1526318472351-c75fcf070305"
             alt="Papaya">

        <img class="image6"
             src="https://images.unsplash.com/photo-1550258987-190a2d41a8ba"
             alt="Pineapple">

    </div>

</body>
</html>
