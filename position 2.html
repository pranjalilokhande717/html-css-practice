<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Collection</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #fff;
    }

   .scene {
  position: relative;
  width: min(780px, 94vw);
  height: 535px;
  overflow: hidden;
  background: linear-gradient(115deg, #ffe783, #ffc6c9);
}
    .card {
  position: absolute;
  z-index: 1;
  left: 9%;
  top: 5%;
  width: 81%;
  height: 66%;
  border-radius: 6px;
  background: #f1f2f3;
    }
    .brand,
    .menu {
      position: absolute;
      top: 16px;
      color: #252b2b;
      font-size: 24px;
    }

    .brand {
      left: 18px;
    }

    .menu {
      right: 18px;
    }

   .copy {
  position: absolute;
  z-index: 2;
  left: 7%;
  top: 28%;
  max-width: 45%;
}
.copy h1 {
      margin: 0 0 30px;
      
      font-family: "Trebuchet MS", sans-serif;
      font-size: clamp(24px, 4vw, 38px);
      font-weight: 500;
      line-height: 1.1;
      text-transform: uppercase;
    }
    
    .copy button {
  padding: 12px 17px;
  border: 0;
  background: #f4a900;
  color: white;
  box-shadow: 4px 4px 0 #ed5570;
}
    
    
   .copy {
  position: absolute;
  z-index: 2;
  left: 7%;
  top: 28%;
  max-width: 45%;
}


.model {
  position: absolute;
  z-index: 3;
  right: 10%;
  bottom: -28%;
  height: 125%;
  width: auto;
  max-width: 48%;
  object-fit: contain;
  object-position: bottom;
  filter: drop-shadow(18px 8px 0 #f04448)
          drop-shadow(32px 14px 0 #f58184);
}
/* Dark red silhouette behind the real model */
.model-shadow {
  z-index: 2;
  filter:
    brightness(0)
    saturate(100%)
    opacity(0.9)
    drop-shadow(18px 12px 0 #f58184);
  transform: translate(12px, 10px);
}

/* Real model sits above its silhouette */
.model:not(.model-shadow) {
  z-index: 3;
}
.model {
  filter: drop-shadow(20px 8px 0 #f04448)
          drop-shadow(38px 14px 0 #f58184);
}
    .sparkle {
      position: absolute;
      z-index: 2;
      color: #f2d972;
      opacity: 0.8;
      font-size: 24px;
    }

    .sparkle-one {
      top: 20%;
      left: 58%;
    }

    .sparkle-two {
      top: 4%;
      left: 65%;
    }

    .sparkle-three {
      top: 16%;
      right: 12%;
    }

    @media (max-width: 550px) {
      .scene {
        height: 440px;
      }

      .copy {
        top: 24%;
      }

      .model {
        right: 2%;
        height: 105%;
        max-width: 55%;
      }
    }
  </style>
</head>

<body>
  <main class="scene">
    <section class="card">
      <div class="brand">✦</div>
      <div class="menu">☰</div>

      <div class="copy">
        <h1>It's time to stand<br />out from the<br />crowd.</h1>
        <button>New Collection</button>
      </div>

      <div class="model-shadow"></div>
      <img class="model" src="./pinkdressimg.png" alt="Model wearing a pink dress">
      <span class="sparkle sparkle-one">✦</span>
      <span class="sparkle sparkle-two">✦</span>
      <span class="sparkle sparkle-three">✦</span>
    </section>
  </main>
</body>
</html>
